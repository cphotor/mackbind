# mackbind 配置示例
#
# **所有字段都是可选的。** 不写这个文件也能获得完整的 macOS 快捷键
# 习惯——本工具的全部映射都内置在默认值里。这里只用于**调整**。
#
# 用户配置路径（优先级由低到高）：
#   /etc/mackbind/config.toml
#   ~/.config/mackbind/config.toml
# 或用环境变量 MACKBIND_CONFIG 指定单个文件。

# ─────────────────────────────────────────────────────────────
# 修饰键互换
# ─────────────────────────────────────────────────────────────
# 默认：CapsLock ↔ 左 Ctrl 成对互换。
# 列表采用**追加**语义（用户条目在默认之后）。
#
# [[remap]]
# from = "KEY_CAPSLOCK"
# to   = "KEY_ESCAPE"
# desc = "CapsLock → Esc"

# ─────────────────────────────────────────────────────────────
# 映射规则表
# ─────────────────────────────────────────────────────────────
# **唯一的映射真源。** 每行回答「用户按了什么，该发什么」。
#
# 三列：
#   apps   适用的应用。省略或 ["*"] = 所有应用。
#          "TerminalEmulator" = 按 .desktop 的 Categories 判定，
#          装新终端自动生效。其余按 wm_class 子串匹配。
#   keys   用户实际按下的组合，**不含 Cmd**（Cmd 是隐含项：按下 Meta
#          本身不输出，只有组合才决定输出）。
#          键名用 evdev 形式（KEY_A、KEY_LEFTBRACE）；前缀表示附加
#          修饰键："S-z" = Shift+Z，"A-Left" = Alt+←。
#          "*" 表示主键通配（配合 terminal_ctrl_shift 使用）。
#   action 做什么。两类：
#          emit              发出固定组合
#          de_accel          读桌面环境现有的绑定，发出同样的键
#          terminal_ctrl_shift  仅当应用自己用 Ctrl+Shift 绑了该键才加 Shift
#
# **顺序即优先级**：自上而下首个命中者生效。你的条目追加在默认之后，
# 故天然覆盖默认。
#
# 查看当前生效的完整表：`mackbind --verbose`（启动时打印）
#
# mods 语法：C=Ctrl, A=Alt, S=Shift, M=Cmd，可用 - 组合如 "C-S"。
#
# [[rules]]
# keys   = ["KEY_HOME"]              # Cmd+Home
# action = { emit = { mods = ["A"], key = "KEY_HOME" } }
# desc   = "跳到文稿开头"
#
# # 只在 VSCode 里把 Cmd+B 改成别的（默认全局已是 Ctrl+B）
# [[rules]]
# apps   = ["code"]
# keys   = ["KEY_B"]
# action = { emit = { mods = ["C"], key = "KEY_B" } }
#
# # 在某个应用里把 Cmd+空格 改成别的动作
# [[rules]]
# apps   = ["firefox"]
# keys   = ["KEY_SPACE"]
# action = { de_accel = "overview" }

# ─────────────────────────────────────────────────────────────
# Fn 键优先级
# ─────────────────────────────────────────────────────────────
# fkeysfirst：按 Fn 出的亮度/媒体键（默认，同内核 fnmode=2）
# fkeyslast：按 Fn 出 F1-F12（同内核 fnmode=1）
# disabled：不做转换
#
# fn_mode = "fkeysfirst"

# ─────────────────────────────────────────────────────────────
# 桌面环境
# ─────────────────────────────────────────────────────────────
# DE 相关行为按此查表。当前 GNOME 系支持最完整；KDE / 裸 WM 下
# 不支持的规则会**跳过**，而非报错。
#
# gnome = GNOME / Mutter 系（含 ptyxis、GNOME 应用）
# kde   = KDE Plasma
# none  = Sway、Hyprland、i3 等，或其他无法查表的环境
#
# DE 相关行为按此查表。当前 GNOME 系支持最完整；KDE / 裸 WM 下
# 不支持的规则会**跳过**，而非报错。
#
# [desktop]
# type = "gnome"

# `Cmd+空格`（macOS 的 Spotlight）是否映射为桌面环境的概览。
#
# 实现方式是**读取** DE 现有的绑定并发出同样的键，而不是改写绑定——
# 因此不会在你的配置里留下任何记录，也不影响你对该键的设置。
#
# GNOME 的概览动作是 `toggle-overview`（本机默认 `Ctrl+Shift+空格`），
# 该组合在 macOS 中是「切换输入法」，语义亦相符。
# 查不到对应动作时自动跳过，不视为错误。
#
# 注意：`Cmd+空格` → 概览这条规则本身已内置在规则表里
# （`de_accel { feature = "overview" }`），此处只是开关。
#
# spotlight = true

# ─────────────────────────────────────────────────────────────
# Ctrl 已被占用的应用
# ─────────────────────────────────────────────────────────────
# 这些应用内 Ctrl 有既定含义（Ctrl+C 中断、Ctrl+V 块选择），
# Cmd 在其中需映射为 **Ctrl+Shift** 以避开。配合规则表里的
# `terminal_ctrl_shift` 动作使用。
#
# **终端无需列举**——按 freedesktop 桌面条目规范判定：
# `.desktop` 的 `Categories` 含 `TerminalEmulator` 即视为终端，
# 新装的终端自动生效。
#
# 此处只用于终端之外的特例，例如独立窗口的 gvim。
#
# ctrl_busy_apps = ["gvim", "org.gnome.gedit"]

# ─────────────────────────────────────────────────────────────
# 需扩展提供焦点窗口信息，用于按应用区分
# ─────────────────────────────────────────────────────────────
# https://extensions.gnome.org/extension/focused-window-dbus/
#
# 验证是否可用（注意 --dest 必须是 org.gnome.Shell）：
#   gdbus call --session --dest org.gnome.Shell \
#     --object-path /org/gnome/shell/extensions/FocusedWindow \
#     --method org.gnome.shell.extensions.FocusedWindow.Get