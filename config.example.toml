# mackbind 配置示例
#
# **所有字段都是可选的。** 不写这个文件也能获得完整的 macOS 快捷键
# 习惯——本工具的全部映射都内置在默认值里。这里只用于**调整**。
#
# 用户配置路径（优先级由低到高）：
#   /etc/mackbind/config.toml
#   ~/.config/mackbind/config.toml
# 或用环境变量 MACKBIND_CONFIG 指定单个文件。

# ─────────────────────────────────────────────────────────────
# 修饰键互换
# ─────────────────────────────────────────────────────────────
# 默认：CapsLock ↔ 左 Ctrl 成对互换。
# 列表采用**追加**语义（用户条目在默认之后）。
#
# [[remap]]
# from = "KEY_CAPSLOCK"
# to   = "KEY_ESCAPE"
# desc = "CapsLock → Esc"

# ─────────────────────────────────────────────────────────────
# Cmd 组合的显式覆盖
# ─────────────────────────────────────────────────────────────
# 默认情况下 `Cmd+X` 自动映射为 `Ctrl+X`，无需在此列举。
# 此表只用于**目标键与主键不同**的情形。
#
# 键名可用 evdev 形式（KEY_A、KEY_LEFTBRACE）；带前缀表示输入侧
# 附加修饰键："S-z" = Shift+Z，"A-Left" = Alt+←。
# emit 语法：C=Ctrl, A=Alt, S=Shift, M=Cmd。
#
# [[cmd_map]]
# keys = ["KEY_HOME"]       # Cmd+Home
# emit = "A-KEY_HOME"       # → Alt+Home
# desc = "跳到文稿开头"

# ─────────────────────────────────────────────────────────────
# Fn 键优先级
# ─────────────────────────────────────────────────────────────
# fkeysfirst：按 Fn 出的亮度/媒体键（默认，同内核 fnmode=2）
# fkeyslast：按 Fn 出 F1-F12（同内核 fnmode=1）
# disabled：不做转换
#
# fn_mode = "fkeysfirst"

# ─────────────────────────────────────────────────────────────
# 桌面环境
# ─────────────────────────────────────────────────────────────
# DE 相关行为按此查表。当前 GNOME 系支持最完整；KDE / 裸 WM 下
# 不支持的规则会**跳过**，而非报错。
#
# gnome = GNOME / Mutter 系（含 ptyxis、GNOME 应用）
# kde   = KDE Plasma
# none  = Sway、Hyprland、i3 等，或其他无法查表的环境
#
# [desktop]
# type = "gnome"

# ─────────────────────────────────────────────────────────────
# Ctrl 已被占用的应用
# ─────────────────────────────────────────────────────────────
# 在这些应用里，`Cmd` 映射为 **Ctrl+Shift** 而非 Ctrl，以避开
# 应用内 Ctrl 的既定含义（Ctrl+C 中断、Ctrl+V 块选择等）。
#
# **终端无需列举**——本工具按 freedesktop 桌面条目规范判定：
# `.desktop` 的 `Categories` 含 `TerminalEmulator` 即视为终端。
# 新装的终端自动生效。
#
# 此处只用于终端之外的特例，例如独立窗口的 gvim。
#
# ctrl_busy_apps = ["gvim", "org.gnome.gedit"]